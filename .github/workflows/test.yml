name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests & Typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth with local dev — see .nvmrc
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # typecheck:all, NOT typecheck — the root tsconfig excludes src/dashboard,
      # so `typecheck` alone leaves the entire frontend ungated.
      - name: Run typecheck (backend + dashboard)
        run: npm run typecheck:all

      - name: Run unit tests
        run: npm run test

      - name: Run architecture tests
        run: npm run test:architecture

      # No-new-debt gate over the reviewed legacy diagnostic baseline (D90).
      # `lint:tests` is deliberately non-zero; this is what actually guards it.
      - name: Run legacy test-lint ratchet
        run: npm run lint:legacy-tests-ratchet

      - name: Build dashboard
        run: npm run build:dashboard
